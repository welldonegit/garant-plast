<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section id="faq" style="background:#F2F0ED;padding:clamp(56px,8vw,100px) 0">
  <div style="max-width:1360px;margin:0 auto;padding:0 clamp(16px,3vw,32px)">
    <h2 style="font-family:Rubik,sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,42px);line-height:1.12;letter-spacing:-0.025em;margin:0 0 clamp(28px,3.6vw,48px);text-wrap:balance">Частые вопросы</h2>
    <div style="display:grid;grid-template-columns:{{ faqCols }};gap:clamp(16px,2.4vw,40px);align-items:start">
      <aside style="position:relative;min-height:{{ faqAsideH }};box-sizing:border-box;overflow:hidden;border-radius:clamp(24px,2.6vw,36px);background-color:#16181A;background-image:radial-gradient(120% 70% at 85% 0%,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 60%);color:#fff;padding:clamp(24px,3vw,44px);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:32px">
        <div>
          <p style="margin:0;font-family:Rubik,sans-serif;font-weight:700;font-size:clamp(26px,2.8vw,38px);line-height:1.1;letter-spacing:-0.03em;text-wrap:balance">Не нашли <span style="color:#3A4851">ответ?</span></p>
          <p style="margin:12px 0 0;max-width:40ch;font-size:16px;line-height:1.6;color:#9AA5AB;text-wrap:pretty">Напишите нам в WhatsApp: ответим про размеры, сроки и монтаж.</p>
          </div>
          <a href="https://wa.me/34000000000" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 32px;border-radius:999px;background:#fff;color:#16181A;font-weight:600;font-size:16px;text-decoration:none;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease;box-shadow:0 0 0 0 rgba(255,255,255,0)" style-hover="color:#16181A;transform:translateY(-1px);box-shadow:0 10px 24px -12px rgba(255,255,255,.35)" style-active="transform:scale(.97)">Задать вопрос</a>
        
      </aside>

      <div style="display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ faq }}" as="item" hint-placeholder-count="5">
          <div style="border-radius:clamp(20px,2vw,28px);background:{{ item.bg }};box-shadow:{{ item.shadow }};transition:background .45s ease,box-shadow .45s ease">
            <button type="button" aria-expanded="{{ item.expanded }}" onClick="{{ item.toggle }}" style="width:100%;background:transparent;border:0;padding:clamp(10px,1.1vw,14px) clamp(12px,1.4vw,16px) clamp(10px,1.1vw,14px) clamp(16px,2vw,28px);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:clamp(12px,1.6vw,22px);text-align:left;color:#16181A;font-family:inherit;cursor:pointer;outline-offset:-2px">
              <span style="font-family:Rubik,sans-serif;font-weight:600;font-size:clamp(16px,1.6vw,19px);line-height:1.3;letter-spacing:-0.01em;text-wrap:pretty">{{ item.q }}</span>
              <span aria-hidden="true" style="position:relative;width:44px;height:44px;border-radius:50%;flex:0 0 auto;background:{{ item.iconBg }};transition:background .45s cubic-bezier(.22,1,.36,1)">
                <span style="position:absolute;top:21.25px;left:15px;width:14px;height:1.5px;border-radius:1px;background:{{ item.iconFg }};transition:background .45s ease"></span>
                <span style="position:absolute;left:21.25px;top:15px;width:1.5px;height:14px;border-radius:1px;background:{{ item.iconFg }};transform:{{ item.vbar }};transition:transform .45s cubic-bezier(.22,1,.36,1),background .45s ease"></span>
              </span>
            </button>
            <div style="display:grid;grid-template-rows:{{ item.rows }};transition:grid-template-rows .5s cubic-bezier(.22,1,.36,1)">
              <div style="overflow:hidden;min-height:0">
                <p style="margin:0;padding:0 clamp(20px,5vw,84px) clamp(16px,1.8vw,22px) {{ faqIndent }};max-width:62ch;color:#41464A;font-size:clamp(15px,1.5vw,16.5px);line-height:1.65;text-wrap:pretty;opacity:{{ item.op }};transition:opacity .4s ease">{{ item.a }}</p>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760}}">
class Component extends DCLogic {
  state = { w: typeof window !== "undefined" ? window.innerWidth : 1440, faq: 0 };
  static FAQ = [
    ["Сколько стоит зимний сад или остекление террасы?", "Цена зависит от размеров проёма, типа профиля и стекла. После бесплатного замера вы получаете смету с фиксированной стоимостью: работы и материалы в ней уже учтены, доплат в процессе монтажа нет."],
    ["Замер и расчёт действительно бесплатные?", "Да. Мастер приезжает на объект, снимает размеры, показывает образцы профиля и стекла и подбирает решение под проём. Расчёт вы получаете в течение одного рабочего дня и ничего за него не платите."],
    ["Сколько времени занимает изготовление и монтаж?", "Изготовление занимает от двух до четырёх недель в зависимости от конструкции. Монтаж раздвижных окон и сеток плиссе обычно укладывается в один день, зимний сад — от двух до четырёх дней."],
    ["Какая гарантия на конструкции и работу?", "Гарантия на профиль, стеклопакеты и фурнитуру — от производителя, на монтаж — от нашей бригады. Сроки прописываем в договоре до начала работ."],
    ["Как ухаживать за окнами и сетками?", "Достаточно протирать профиль и стекло мягким средством и раз в год очищать направляющие и смазывать фурнитуру. Сетки плиссе моют в собранном виде, снимать их не нужно."]
  ];
  componentDidMount() {
    this._onResize = () => { const w = window.innerWidth; if (w !== this.state.w) this.setState({ w }); };
    window.addEventListener("resize", this._onResize);
    this._onResize();
  }
  componentWillUnmount() { window.removeEventListener("resize", this._onResize); }
  renderVals() {
    const w = this.state.w;
    return {
      faqAsideH: w >= 1000 ? "clamp(480px,40vw,560px)" : "0px",
      faqCols: w >= 1000 ? "minmax(0,0.82fr) minmax(0,1.18fr)" : "minmax(0,1fr)",
      faqIndent: "clamp(16px,2vw,28px)",
      faq: Component.FAQ.map((it, i) => {
        const on = this.state.faq === i;
        return {
          n: String(i + 1).padStart(2, "0"), q: it[0], a: it[1],
          expanded: on ? "true" : "false",
          bg: on ? "#FFFFFF" : "rgba(255,255,255,.5)",
          shadow: on ? "0 1px 2px rgba(22,24,26,.04),0 18px 40px -24px rgba(22,24,26,.22)" : "0 0 0 0 rgba(22,24,26,0)",
          iconBg: on ? "#16181A" : "#ECE9E5", iconFg: on ? "#FFFFFF" : "#16181A",
          vbar: on ? "rotate(90deg) scaleY(0)" : "rotate(0deg) scaleY(1)",
          rows: on ? "1fr" : "0fr", op: on ? 1 : 0,
          toggle: () => this.setState(s => ({ faq: s.faq === i ? null : i }))
        };
      })
    };
  }
}
</script>
</body>
</html>
