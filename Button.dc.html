<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isLink }}" hint-placeholder-val="{{ false }}">
<a href="{{ href }}" target="{{ target }}" rel="{{ rel }}" tabindex="{{ tabIndex }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onMouseDown="{{ down }}" onMouseUp="{{ up }}" onFocus="{{ focus }}" onBlur="{{ leave }}" onClick="{{ press }}" style="position:relative;isolation:isolate;overflow:hidden;box-sizing:border-box;display:{{ disp }};align-items:center;justify-content:center;width:{{ w }};height:{{ h }};min-height:{{ mh }};padding:{{ pad }};border-radius:999px;border:1px solid {{ bd }};background:{{ bg }};font-family:inherit;font-weight:600;font-size:{{ fs }};text-decoration:none;white-space:nowrap;cursor:pointer;outline-offset:3px;-webkit-tap-highlight-color:transparent;transform:scale({{ sc }});transition:transform .4s cubic-bezier(.19,1,.22,1),{{ bgT }}">
  <span aria-hidden="true" style="position:absolute;z-index:0;left:{{ x }};top:{{ y }};width:{{ d }};height:{{ d }};border-radius:50%;background:{{ fill }};pointer-events:none;transform:translate(-50%,-50%) scale({{ fs2 }});transition:transform .75s cubic-bezier(.19,1,.22,1)"></span>
  <span style="position:relative;z-index:1;display:block;overflow:hidden;height:1.3em;line-height:1.3em">
    <span style="display:flex;flex-direction:column;transform:translateY({{ ty }});transition:transform .6s cubic-bezier(.19,1,.22,1) .03s">
      <span style="display:flex;align-items:center;justify-content:center;gap:10px;height:1.3em;color:{{ fg }}">
        <sc-if value="{{ isWa }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1.2-3.6A8 8 0 1 1 8.4 18.6z"></path><path d="M9.2 9.3c.2 2.4 2.6 4.9 5.2 5.3l1.2-1.2-1.8-1-.8.7c-.9-.4-1.8-1.3-2.2-2.2l.7-.8-1-1.8z"></path></svg></sc-if>
        {{ label }}
        <sc-if value="{{ isArrow }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></sc-if>
      </span>
      <span aria-hidden="true" style="display:flex;align-items:center;justify-content:center;gap:10px;height:1.3em;color:{{ hfg }}">
        <sc-if value="{{ isWa }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1.2-3.6A8 8 0 1 1 8.4 18.6z"></path><path d="M9.2 9.3c.2 2.4 2.6 4.9 5.2 5.3l1.2-1.2-1.8-1-.8.7c-.9-.4-1.8-1.3-2.2-2.2l.7-.8-1-1.8z"></path></svg></sc-if>
        {{ label }}
        <sc-if value="{{ isArrow }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></sc-if>
      </span>
    </span>
  </span>
</a>
</sc-if>
<sc-if value="{{ isBtn }}" hint-placeholder-val="{{ true }}">
<button type="{{ type }}" tabindex="{{ tabIndex }}" aria-haspopup="{{ haspopup }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onMouseDown="{{ down }}" onMouseUp="{{ up }}" onFocus="{{ focus }}" onBlur="{{ leave }}" onClick="{{ press }}" style="position:relative;isolation:isolate;overflow:hidden;box-sizing:border-box;display:{{ disp }};align-items:center;justify-content:center;width:{{ w }};height:{{ h }};min-height:{{ mh }};padding:{{ pad }};border-radius:999px;border:1px solid {{ bd }};background:{{ bg }};font-family:inherit;font-weight:600;font-size:{{ fs }};white-space:nowrap;cursor:pointer;outline-offset:3px;-webkit-tap-highlight-color:transparent;transform:scale({{ sc }});transition:transform .4s cubic-bezier(.19,1,.22,1),{{ bgT }}">
  <span aria-hidden="true" style="position:absolute;z-index:0;left:{{ x }};top:{{ y }};width:{{ d }};height:{{ d }};border-radius:50%;background:{{ fill }};pointer-events:none;transform:translate(-50%,-50%) scale({{ fs2 }});transition:transform .75s cubic-bezier(.19,1,.22,1)"></span>
  <span style="position:relative;z-index:1;display:block;overflow:hidden;height:1.3em;line-height:1.3em">
    <span style="display:flex;flex-direction:column;transform:translateY({{ ty }});transition:transform .6s cubic-bezier(.19,1,.22,1) .03s">
      <span style="display:flex;align-items:center;justify-content:center;gap:10px;height:1.3em;color:{{ fg }}">
        <sc-if value="{{ isWa }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1.2-3.6A8 8 0 1 1 8.4 18.6z"></path><path d="M9.2 9.3c.2 2.4 2.6 4.9 5.2 5.3l1.2-1.2-1.8-1-.8.7c-.9-.4-1.8-1.3-2.2-2.2l.7-.8-1-1.8z"></path></svg></sc-if>
        {{ label }}
        <sc-if value="{{ isArrow }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></sc-if>
      </span>
      <span aria-hidden="true" style="display:flex;align-items:center;justify-content:center;gap:10px;height:1.3em;color:{{ hfg }}">
        <sc-if value="{{ isWa }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5l1.2-3.6A8 8 0 1 1 8.4 18.6z"></path><path d="M9.2 9.3c.2 2.4 2.6 4.9 5.2 5.3l1.2-1.2-1.8-1-.8.7c-.9-.4-1.8-1.3-2.2-2.2l.7-.8-1-1.8z"></path></svg></sc-if>
        {{ label }}
        <sc-if value="{{ isArrow }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></sc-if>
      </span>
    </span>
  </span>
</button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:120},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Запросить точный расчёт&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;primary-light&quot;,&quot;dark&quot;,&quot;outline&quot;,&quot;ghost&quot;,&quot;ghost-light&quot;],&quot;default&quot;:&quot;primary&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;lg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;arrow&quot;,&quot;whatsapp&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;block&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;stretch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;target&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;button&quot;,&quot;submit&quot;],&quot;default&quot;:&quot;button&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPress&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;},&quot;tabIndex&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;haspopup&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
const VARIANTS = {
  primary:        { bg: '#E24C2B', bd: 'transparent', fg: '#fff', fill: '#16181A', hfg: '#fff' },
  'primary-light':{ bg: '#E24C2B', bd: 'transparent', fg: '#fff', fill: '#fff', hfg: '#16181A' },
  dark:           { bg: '#16181A', bd: 'transparent', fg: '#fff', fill: '#E24C2B', hfg: '#fff' },
  outline:        { bg: 'transparent', bd: '#16181A', fg: '#16181A', fill: '#16181A', hfg: '#fff' },
  ghost:          { bg: 'transparent', bd: 'transparent', fg: '#16181A', fill: '#16181A', hfg: '#fff' },
  'ghost-light':  { bg: 'transparent', bd: 'transparent', fg: '#fff', fill: '#fff', hfg: '#16181A' }
};
const SIZES = {
  sm: { mh: 46, fs: 15, pad: '0 22px' },
  md: { mh: 52, fs: 16, pad: '0 28px' },
  lg: { mh: 56, fs: 16.5, pad: '0 32px' }
};
class Component extends DCLogic {
  state = { h: false, p: false, x: 0, y: 0, d: 0 };
  setFrom(el, cx, cy) {
    const r = el.getBoundingClientRect();
    this.setState({ h: true, x: cx - r.left, y: cy - r.top, d: Math.hypot(r.width, r.height) * 2.1 });
  }
  renderVals() {
    const p = this.props, s = this.state;
    const v = VARIANTS[p.variant] || VARIANTS.primary;
    const z = SIZES[p.size] || SIZES.md;
    const stretch = !!p.stretch, block = !!p.block;
    return {
      ...v,
      bg: s.h ? v.fill : v.bg,
      bd: s.h ? v.fill : v.bd,
      bgT: s.h ? "background-color .2s ease .28s,border-color .2s ease .28s" : "background-color 0s,border-color 0s",
      label: p.label ?? 'Кнопка',
      href: p.href, target: p.target, rel: p.target === '_blank' ? 'noopener' : undefined,
      type: p.type || 'button', tabIndex: p.tabIndex, haspopup: p.haspopup,
      isLink: !!p.href, isBtn: !p.href,
      isWa: p.icon === 'whatsapp', isArrow: p.icon === 'arrow',
      disp: block || stretch ? 'flex' : 'inline-flex',
      w: block || stretch ? '100%' : 'auto', h: stretch ? '100%' : 'auto',
      mh: z.mh + 'px', fs: z.fs + 'px', pad: z.pad,
      x: s.x + 'px', y: s.y + 'px', d: s.d + 'px',
      fs2: s.h ? 1 : 0, ty: s.h ? '-50%' : '0%', sc: s.p ? 0.965 : 1,
      enter: e => this.setFrom(e.currentTarget, e.clientX, e.clientY),
      leave: () => this.setState({ h: false, p: false }),
      down: () => this.setState({ p: true }),
      up: () => this.setState({ p: false }),
      focus: e => {
        const el = e.currentTarget;
        if (!el.matches(':focus-visible')) return;
        const r = el.getBoundingClientRect();
        this.setFrom(el, r.left + r.width / 2, r.top + r.height / 2);
      },
      press: e => { if (p.onPress) p.onPress(e); }
    };
  }
}
</script>
</body>
</html>
